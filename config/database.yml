default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: app_development
  host: db
  username: postgres
  password: password

test:
  <<: *default
  database: app_test
  host: db
  username: postgres
  password: password

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
